[package]
name = "pgwal-doctor"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["PEPAI <pep_ai@icloud.com>"]
description = "Read-only report of why PostgreSQL's pg_wal keeps growing"
repository = "https://github.com/qwpp7g79y4-maker/pgwal-doctor"
documentation = "https://github.com/qwpp7g79y4-maker/pgwal-doctor"
exclude = [".github/", "*-plugin/"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "pgwal_doctor"
path = "src/lib.rs"

[[bin]]
name = "pgwal-doctor"
path = "src/main.rs"
